<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0E7B3E" />
  <title>AP Schools · MDM & Cook Portal</title>

  <link rel="icon" href="../assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../assets/icon-192.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../style.css" />
  <style>
    .mdm-card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true">
    <div class="bg-glow bg-glow-green"></div>
    <div class="bg-glow bg-glow-gold"></div>
    <div class="bg-grid"></div>
  </div>

  <div class="app">
    <header class="app-header">
      <div class="header-brand">
        <img src="../assets/emblem.png" alt="Emblem" class="header-logo" />
        <div>
          <h1>AP Schools</h1>
          <p>MDM & Cook Portal</p>
        </div>
      </div>
      <a href="./dashboard.html" style="background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 6px 12px; border-radius: 8px; font-size: 0.72rem; font-weight: 600; text-decoration: none;">← Dashboard</a>
    </header>

    <main class="app-view">
      <div class="mdm-card">
        <h2 style="font-family: 'Playfair Display', serif; font-size: 1.15rem; color: var(--primary-darker); margin-bottom: 4px;">Jagananna Goru Muddula</h2>
        <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 14px;">Midday meal distribution checklist & cook logs.</p>

        <form id="mdm-form" onsubmit="handleMdmSubmit(event)" class="form-vertical">
          <div class="form-group">
            <label for="mdm-date">Meal Date</label>
            <input type="date" id="mdm-date" required />
          </div>

          <div class="form-group">
            <label for="day-menu">Today's Scheduled Menu</label>
            <select id="day-menu" required>
              <option value="" disabled selected>-- Select Menu Item --</option>
              <option value="Monday: Rice, Pappu Charu & Boiled Egg">Monday: Rice, Pappu Charu & Boiled Egg</option>
              <option value="Tuesday: Rice, Sambar & Vegetable Fry">Tuesday: Rice, Sambar & Vegetable Fry</option>
              <option value="Wednesday: Rice, Pulihora & Boiled Egg / Sweet">Wednesday: Rice, Pulihora & Boiled Egg / Sweet</option>
              <option value="Thursday: Rice, Dal / Pappu & Vegetable Curry">Thursday: Rice, Dal / Pappu & Vegetable Curry</option>
              <option value="Friday: Rice, Chintapandu Pulusu & Boiled Egg">Friday: Rice, Chintapandu Pulusu & Boiled Egg</option>
              <option value="Saturday: Rice, Kichidi / Sweet Pongal & Egg">Saturday: Rice, Kichidi / Sweet Pongal & Egg</option>
            </select>
          </div>

          <div class="form-group">
            <label for="students-fed">Total Students Fed</label>
            <input type="number" id="students-fed" placeholder="Enter number of students present" required min="1" />
          </div>

          <div class="form-group">
            <label for="cook-name">Cook / Agency Name</label>
            <input type="text" id="cook-name" placeholder="Enter head cook name" required />
          </div>

          <div class="form-group">
            <label for="meal-quality">Meal Quality & Hygiene Check</label>
            <select id="meal-quality" required>
              <option value="Excellent & Hygienic">Excellent & Hygienic</option>
              <option value="Good">Good</option>
              <option value="Satisfactory">Satisfactory</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary btn-block" style="margin-top: 16px; padding: 14px;">
            Save & Share MDM Log →
          </button>
        </form>
      </div>
    </main>

    <footer class="app-footer">
      <p style="font-weight: 600; color: var(--primary-dark); margin-bottom: 6px;">An initiative of @VALIASS team</p>
      <div class="support-links" style="display: flex; justify-content: center; gap: 12px; align-items: center;">
        <a href="tel:8985361991" class="support-link support-call" style="width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 0.9rem; box-shadow: var(--shadow-sm);" title="Call">📞</a>
        <a href="https://wa.me/918985361991" target="_blank" rel="noopener" class="support-link support-whatsapp" style="width: 32px; height: 32px; border-radius: 50%; background: #25D366; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 0.9rem; box-shadow: var(--shadow-sm);" title="WhatsApp">💬</a>
      </div>
    </footer>
  </div>

  <script src="../js/app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('mdm-date').value = new Date().toISOString().split('T')[0];
    });

    function handleMdmSubmit(e) {
      e.preventDefault();
      const date = document.getElementById('mdm-date').value;
      const menu = document.getElementById('day-menu').value;
      const count = document.getElementById('students-fed').value;
      const cook = document.getElementById('cook-name').value;
      const quality = document.getElementById('meal-quality').value;
      const schoolName = localStorage.getItem('ap_school_name') || 'AP School';

      const newLog = {
        type: 'mdm',
        date,
        menu,
        count,
        cook,
        quality,
        school: schoolName,
        timestamp: Date.now()
      };

      let existingLogs = JSON.parse(localStorage.getItem('ap_school_logs') || '[]');
      existingLogs.unshift(newLog);
      localStorage.setItem('ap_school_logs', JSON.stringify(existingLogs));

      const waText = encodeURIComponent(
        `🍲 *JAGANANNA GORU MUDDULA - MDM LOG* 🏫\n` +
        `📍 School: ${schoolName}\n` +
        `📅 Date: ${date}\n` +
        `🍛 Menu: ${menu}\n` +
        `👶 Students Fed: ${count}\n` +
        `👩‍🍳 Cook: ${cook}\n` +
        `✨ Quality Check: ${quality}\n\n` +
        `_An initiative of @VALIASS team_`
      );

      alert('MDM record saved successfully! Redirecting to WhatsApp share...');
      window.open(`https://wa.me/?text=${waText}`, '_blank');
      window.location.href = './dashboard.html';
    }
  </script>
</body>
</html>
