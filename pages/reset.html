<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0E7B3E" />
  <title>AP Schools · Security & PIN Reset</title>

  <link rel="icon" href="../assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../assets/icon-192.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../style.css" />
  <style>
    .reset-card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true">
    <div class="bg-glow bg-glow-green"></div>
    <div class="bg-glow bg-glow-gold"></div>
    <div class="bg-grid"></div>
  </div>

  <div class="app">
    <header class="app-header">
      <div class="header-brand">
        <img src="../assets/emblem.png" alt="Emblem" class="header-logo" />
        <div>
          <h1>AP Schools</h1>
          <p>Security & Reset</p>
        </div>
      </div>
      <a href="./login.html" style="background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 6px 12px; border-radius: 8px; font-size: 0.72rem; font-weight: 600; text-decoration: none;">← Login</a>
    </header>

    <main class="app-view">
      <div class="reset-card">
        <h2 style="font-family: 'Playfair Display', serif; font-size: 1.15rem; color: var(--primary-darker); margin-bottom: 4px;">Reset App PIN</h2>
        <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 14px;">Verify authorized VALIASS secret code to set a new PIN.</p>

        <form id="reset-form" onsubmit="handleResetSubmit(event)" class="form-vertical">
          <div class="form-group">
            <label for="reset-secret">VALIASS Secret Code</label>
            <input type="password" id="reset-secret" placeholder="Enter team secret code" required />
          </div>

          <div class="form-group">
            <label for="new-pin">New 4-Digit App PIN</label>
            <input type="password" id="new-pin" placeholder="Enter 4-digit numbers only" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" required />
          </div>

          <button type="submit" class="btn btn-primary btn-block" style="margin-top: 16px; padding: 14px;">
            Update PIN & Secure App →
          </button>
        </form>
      </div>
    </main>

    <footer class="app-footer">
      <p style="font-weight: 600; color: var(--primary-dark); margin-bottom: 6px;">An initiative of @VALIASS team</p>
      <div class="support-links" style="display: flex; justify-content: center; gap: 12px; align-items: center;">
        <a href="tel:8985361991" class="support-link support-call" style="width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 0.9rem; box-shadow: var(--shadow-sm);" title="Call">📞</a>
        <a href="https://wa.me/918985361991" target="_blank" rel="noopener" class="support-link support-whatsapp" style="width: 32px; height: 32px; border-radius: 50%; background: #25D366; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 0.9rem; box-shadow: var(--shadow-sm);" title="WhatsApp">💬</a>
      </div>
    </footer>
  </div>

  <script src="../js/app.js"></script>
  <script>
    function handleResetSubmit(e) {
      e.preventDefault();
      const secretCode = document.getElementById('reset-secret').value.trim();
      const newPin = document.getElementById('new-pin').value;

      if (!verifySchoolActivation(secretCode)) {
        alert('Invalid VALIASS Secret Code. Please check the code.');
        return;
      }

      localStorage.setItem('ap_app_password', newPin);
      localStorage.removeItem('ap_failed_attempts');
      localStorage.removeItem('ap_lockout_time');

      alert('PIN updated successfully! Please login with your new PIN.');
      window.location.href = './login.html';
    }
  </script>
</body>
</html>
